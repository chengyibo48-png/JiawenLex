name: Encrypted weekly backup
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
concurrency:
  group: jiawenlex-encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates curl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/backup.mjs backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_SECRET: ${{ secrets.BACKUP_ENCRYPTION_SECRET }}
          SOURCE_S3_ENDPOINT: ${{ secrets.SOURCE_S3_ENDPOINT }}
          SOURCE_S3_REGION: ${{ secrets.SOURCE_S3_REGION }}
          SOURCE_S3_BUCKET: ${{ secrets.SOURCE_S3_BUCKET }}
          SOURCE_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.SOURCE_BACKUP_S3_ACCESS_KEY_ID }}
          SOURCE_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_MAX_STORAGE_BYTES: ${{ vars.BACKUP_MAX_STORAGE_BYTES || '6000000000' }}
          BACKUP_MAX_SNAPSHOT_BYTES: ${{ vars.BACKUP_MAX_SNAPSHOT_BYTES || '500000000' }}
          BACKUP_S3_VERSIONED: ${{ vars.BACKUP_S3_VERSIONED }}
